<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineEstelar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e63946'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EC%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f0f14">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="barra">
  <a class="logo" href="#/">CINE<span>ESTELAR</span></a>
  <nav id="nav-user"></nav>
</header>
<main id="vista"></main>
<footer class="pie">Datos e imágenes de películas: TMDB. Este producto usa la API de TMDB pero no está avalado ni certificado por TMDB.</footer>

<dialog id="auth">
  <div class="tabs"><a id="t-login" class="on">Ingresar</a><a id="t-reg">Crear cuenta</a></div>
  <form id="f-login" class="form col">
    <input name="correo" type="email" placeholder="Correo" required>
    <input name="password" type="password" placeholder="Contraseña" required>
    <button class="btn">Entrar</button>
  </form>
  <form id="f-reg" class="form col" hidden>
    <input name="nombre" placeholder="Nombre completo" required minlength="2">
    <input name="correo" type="email" placeholder="Correo" required>
    <input name="password" type="password" placeholder="Contraseña (mínimo 8)" required minlength="8">
    <label class="campo">Fecha de nacimiento<input name="fecha_nacimiento" type="date" required></label>
    <button class="btn">Registrarme</button>
  </form>
  <button class="btn ghost" id="cerrar-auth" type="button">Cerrar</button>
</dialog>

<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
